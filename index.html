// Public entry point (Python generate_festive_audio 1093-1128, minus WAV I/O)
// ---------------------------------------------------------------------------

function synthesizeSoundtrack(duration, starTime, theme) {
  if (duration === undefined) duration = 20.0;
  if (starTime === undefined) starTime = 11.8;
  if (theme === undefined) theme = "last_christmas";

  const total_samples = Math.max(1, Math.trunc(duration * AUDIO_SR));
  const buf = { l: new Float32Array(total_samples), r: new Float32Array(total_samples) };

  if (theme === "traditional") {
    _render_traditional(buf, duration, starTime);
  } else if (theme === "last_christmas") {
    _render_last_christmas(buf, duration, starTime);
  } else {
    throw new Error("Unknown audio theme: '" + theme + "'");
  }

  const wet = _apply_reverb(buf);
  const fade_samples = Math.min(total_samples, Math.trunc(0.85 * AUDIO_SR));
  if (fade_samples > 0) {
    const span = fade_samples > 1 ? fade_samples - 1 : 1;
    const base = total_samples - fade_samples;
    for (let i = 0; i < fade_samples; i++) {
      const f = Math.fround(fade_samples > 1 ? 1.0 - i / span : 1.0);
      wet.l[base + i] *= f;
      wet.r[base + i] *= f;
    }
  }

  let peak = 0.0;
  for (let i = 0; i < total_samples; i++) {
    const al = wet.l[i] < 0 ? -wet.l[i] : wet.l[i];
    const ar = wet.r[i] < 0 ? -wet.r[i] : wet.r[i];
    if (al > peak) peak = al;
    if (ar > peak) peak = ar;
  }
  if (peak > 0.0) {
    const scale = 0.88 / Math.max(peak, 1.0);
    for (let i = 0; i < total_samples; i++) {
      wet.l[i] *= scale;
      wet.r[i] *= scale;
    }
  }

  const left = new Float32Array(total_samples);
  const right = new Float32Array(total_samples);
  const tanh = Math.tanh;
  for (let i = 0; i < total_samples; i++) {
    left[i] = tanh(wet.l[i]);
    right[i] = tanh(wet.r[i]);
  }
  return { sampleRate: AUDIO_SR, left: left, right: right };
}


/* ===================== render.js ===================== */
// render.js — canvas glyph-atlas rasteriser, two-scale additive bloom and HUD.
// Port of christmas_tree.py lines 55-93 (BG_RGB + renderer constants) and
// class Renderer (lines 677-779). Concatenated after scene.js / frame.js / audio.js.

class Renderer {
  constructor(canvas, opts) {
    opts = opts || {};
    const cw = opts.cw !== undefined ? opts.cw : CW;
    const ch = opts.ch !== undefined ? opts.ch : CH;
    const fontPx = opts.fontPx !== undefined ? opts.fontPx : FONT_PX;
    const hudPx = opts.hudPx !== undefined ? opts.hudPx : 15;
    const author = opts.author !== undefined ? opts.author : DEFAULT_AUTHOR;
    const showHint = opts.showHint !== undefined ? opts.showHint : true;
    const hint = opts.hint !== undefined ? opts.hint : HINT;

    this.canvas = canvas;
    this.cols = COLS;
    this.rows = ROWS;
    this.cw = cw;
    this.ch = ch;
    this.w = COLS * cw;
    this.h = ROWS * ch;
    this.fontPx = fontPx;
    this.hudPx = hudPx;
    this.author = author;
    this.showHint = showHint;
    this.hint = hint;

    // pygame SysFont(MONO, n) equivalent; MONO lacks the spaced family names.
    this._family = 'Consolas, Menlo, "DejaVu Sans Mono", Courier New, monospace';
    // Approximate hud_font.get_height() for dot radius / hint baseline.
    this._hudFontH = Math.max(1, Math.round(hudPx * 1.2));

    const W = this.w;
    const H = this.h;

    canvas.width = W;
    canvas.height = H;
    const ctx = canvas.getContext('2d');
    this.ctx = ctx;

    function makeCanvas(w, h) {
      const c = document.createElement('canvas');
      c.width = Math.max(1, w);
      c.height = Math.max(1, h);
      return c;
    }

    // --- Persistent offscreen buffers (no per-frame allocation) ---
    // Full-size glyph layer (3-channel data + alpha), reused every frame.
    this.layerCanvas = makeCanvas(W, H);
    this.layerCtx = this.layerCanvas.getContext('2d');
    this.layerData = this.layerCtx.createImageData(W, H);
    this.layerPx = this.layerData.data;

    // Full-size "bright" layer: max(0, glyph - 35) for bloom.
    this.brightCanvas = makeCanvas(W, H);
    this.brightCtx = this.brightCanvas.getContext('2d');
    this.brightData = this.brightCtx.createImageData(W, H);
    this.brightPx = this.brightData.data;

    // Bloom scales: w//2,h//2 and w//6,h//6 (cv2.resize targets).
    this.halfW = Math.max(1, Math.floor(W / 2));
    this.halfH = Math.max(1, Math.floor(H / 2));
    this.halfCanvas = makeCanvas(this.halfW, this.halfH);
    this.halfCtx = this.halfCanvas.getContext('2d');

    this.sixthW = Math.max(1, Math.floor(W / 6));
    this.sixthH = Math.max(1, Math.floor(H / 6));
    this.sixthCanvas = makeCanvas(this.sixthW, this.sixthH);
    this.sixthCtx = this.sixthCanvas.getContext('2d');

    // --- 95-glyph atlas, ASCII 32..126, coverage = alpha channel ---
    const cellPx = cw * ch;
    this._cellPx = cellPx;
    this.glyph = new Uint8Array(95 * cellPx);

    const cell = makeCanvas(cw, ch);
    const cellCtx = cell.getContext('2d', { willReadFrequently: true });
    cellCtx.textAlign = 'center';
    cellCtx.textBaseline = 'middle';
    cellCtx.fillStyle = 'rgb(255,255,255)';
    cellCtx.font = fontPx + 'px ' + this._family;

    for (let code = 32; code < 127; code++) {
      cellCtx.clearRect(0, 0, cw, ch);
      cellCtx.fillText(String.fromCharCode(code), cw / 2, ch / 2);
      const px = cellCtx.getImageData(0, 0, cw, ch).data;
      const gbase = (code - 32) * cellPx;
      for (let p = 0; p < cellPx; p++) this.glyph[gbase + p] = px[p * 4 + 3];
    }
  }

  // Mirrors Renderer.render_surface(): sparse glyph composite, bloom, HUD.
  render(char, col, t, info) {
    const cols = this.cols;
    const rows = this.rows;
    const cw = this.cw;
    const ch = this.ch;
    const W = this.w;
    const H = this.h;
    const glyph = this.glyph;
    const layer = this.layerPx;
    const bright = this.brightPx;
    const cellPx = this._cellPx;
    const rowSpan = (W - cw) * 4;

    layer.fill(0);
    bright.fill(0);

    // canvas[rr, cc] = clip(atlas[idx] * (col * 255), 0, 255)
    for (let r = 0; r < rows; r++) {
      const base = r * cols;
      const py = r * ch;
      for (let c = 0; c < cols; c++) {
        const code = char[base + c];
        if (code < 32) continue;
        let gi = code - 32;
        if (gi > 94) gi = 94;
        const gbase = gi * cellPx;
        const ci = (base + c) * 3;
        const cr = col[ci];
        const cg = col[ci + 1];
        const cb = col[ci + 2];
        let o = (py * W + c * cw) * 4;
        for (let gy = 0; gy < ch; gy++) {
          const g = gbase + gy * cw;
          for (let gx = 0; gx < cw; gx++) {
            const cov = glyph[g + gx];
            if (cov !== 0) {
              // cov/255 * col * 255 == cov * col; clip the product like np.clip.
              let vr = cov * cr;
              if (vr < 0) vr = 0; else if (vr > 255) vr = 255;
              let vg = cov * cg;
              if (vg < 0) vg = 0; else if (vg > 255) vg = 255;
              let vb = cov * cb;
              if (vb < 0) vb = 0; else if (vb > 255) vb = 255;
              const ir = vr | 0;
              const ig = vg | 0;
              const ib = vb | 0;
              layer[o] = ir;
              layer[o + 1] = ig;
              layer[o + 2] = ib;
              layer[o + 3] = 255;
              // cv2.subtract(img, (35,35,35,0)) saturates at 0.
              bright[o] = ir > 35 ? ir - 35 : 0;
              bright[o + 1] = ig > 35 ? ig - 35 : 0;
              bright[o + 2] = ib > 35 ? ib - 35 : 0;
              bright[o + 3] = 255;
            }
            o += 4;
          }
          o += rowSpan;
        }
      }
    }

    this.layerCtx.putImageData(this.layerData, 0, 0);
    this.brightCtx.putImageData(this.brightData, 0, 0);

    const ctx = this.ctx;
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.filter = 'none';
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';

    // cv2.add(img, BG_RGB)
    ctx.fillStyle = 'rgb(' + BG_RGB[0] + ',' + BG_RGB[1] + ',' + BG_RGB[2] + ')';
    ctx.fillRect(0, 0, W, H);

    // img added additively
    ctx.globalCompositeOperation = 'lighter';
    ctx.drawImage(this.layerCanvas, 0, 0);

    // (a) resize w//2,h//2 -> GaussianBlur sigma 2.4 -> resize up, weight 0.50
    const hc = this.halfCtx;
    hc.globalCompositeOperation = 'source-over';
    hc.globalAlpha = 1;
    hc.imageSmoothingEnabled = true;
    hc.imageSmoothingQuality = 'high';
    hc.filter = 'none';
    hc.fillStyle = '#000';
    hc.fillRect(0, 0, this.halfW, this.halfH);
    hc.filter = 'blur(2.4px)';
    hc.drawImage(this.brightCanvas, 0, 0, this.halfW, this.halfH);
    hc.filter = 'none';

    ctx.globalAlpha = 0.50;
    ctx.drawImage(this.halfCanvas, 0, 0, W, H);

    // (b) resize w//6,h//6 -> GaussianBlur sigma 2.6 -> resize up, weight 0.45
    const sc = this.sixthCtx;
    sc.globalCompositeOperation = 'source-over';
    sc.globalAlpha = 1;
    sc.imageSmoothingEnabled = true;
    sc.imageSmoothingQuality = 'high';
    sc.filter = 'none';
    sc.fillStyle = '#000';
    sc.fillRect(0, 0, this.sixthW, this.sixthH);
    sc.filter = 'blur(2.6px)';
    sc.drawImage(this.brightCanvas, 0, 0, this.sixthW, this.sixthH);
    sc.filter = 'none';

    ctx.globalAlpha = 0.45;
    ctx.drawImage(this.sixthCanvas, 0, 0, W, H);

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    this._drawHud(t, info);
  }

  // Mirrors Renderer._draw_hud().
  _drawHud(t, info) {
    const ctx = this.ctx;
    const W = this.w;
    const H = this.h;
    const padX = Math.max(16, Math.trunc(this.cw * 2.0));
    const padY = Math.max(14, Math.trunc(this.ch * 1.1));
    const fontH = this._hudFontH;
    const lineH = Math.max(this.hudPx, Math.trunc(this.hudPx * 1.32));

    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.filter = 'none';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.font = this.hudPx + 'px ' + this._family;

    const rot = info && info.rotation_deg !== undefined ? info.rotation_deg : 0;
    const lights = info && info.lights !== undefined ? info.lights : 0;
    const letters = info && info.letters !== undefined ? info.letters : 0;

    // Top-right timer badge: f"t {t:05.2f}s"
    let tStr = t.toFixed(2);
    while (tStr.length < 5) tStr = '0' + tStr;
    const tLbl = 't ' + tStr + 's';
    const tW = ctx.measureText(tLbl).width;
    const tx = W - padX - tW;
    const ty = padY;
    const dotR = Math.max(3, Math.floor(fontH / 5));
    const dotDx = Math.max(13, Math.trunc(this.hudPx * 0.85));
    ctx.fillStyle = 'rgb(' + ACCENT[0] + ',' + ACCENT[1] + ',' + ACCENT[2] + ')';
    ctx.beginPath();
    ctx.arc(tx - dotDx, ty + Math.floor(fontH / 2) + 1, dotR, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillText(tLbl, tx, ty);

    // Bottom-left signature & telemetry
    const by = H - padY - lineH * 3;
    ctx.fillStyle = 'rgb(' + SIGN[0] + ',' + SIGN[1] + ',' + SIGN[2] + ')';
    ctx.fillText(this.author, padX, by);

    let rStr = rot.toFixed(2);
    while (rStr.length < 6) rStr = '0' + rStr;
    let lStr = String(Math.trunc(lights));
    while (lStr.length < 3) lStr = ' ' + lStr;
    ctx.fillStyle = 'rgb(' + DIM[0] + ',' + DIM[1] + ',' + DIM[2] + ')';
    ctx.fillText('rotation ' + rStr + '°     lights ' + lStr, padX, by + lineH);
    ctx.fillText('letters ' + this._commas(letters), padX, by + lineH * 2);

    if (this.showHint) {
      ctx.fillStyle = 'rgb(68,76,92)';
      const hW = ctx.measureText(this.hint).width;
      ctx.fillText(this.hint, W - padX - hW, H - padY - fontH);
    }
  }

  // Python f"{n:,}" for non-negative integers.
  _commas(n) {
    const s = String(Math.trunc(n));
    let out = '';
    let count = 0;
    for (let i = s.length - 1; i >= 0; i--) {
      out = s.charAt(i) + out;
      count++;
      if (count % 3 === 0 && i > 0) out = ',' + out;
    }
    return out;
  }
}


/* ===================== page shell ===================== */
(function () {
  var params = new URLSearchParams(location.search);
  var theme = params.get("theme") === "traditional" ? "traditional" : "last_christmas";
  var THEME_NAMES = {
    last_christmas: "Last Christmas",
    traditional: "We Wish You a Merry Christmas"
  };

  var startT = parseFloat(params.get("t"));
  if (!isFinite(startT)) startT = 0;
  startT = Math.max(0, Math.min(DURATION, startT));

  var canvas = document.getElementById("tree");
  var overlay = document.getElementById("overlay");
  var btnSound = document.getElementById("btnSound");
  var btnMute = document.getElementById("btnMute");
  var loadingEl = document.getElementById("loading");
  var themeLabel = document.getElementById("themeLabel");
  var toastEl = document.getElementById("toast");

  themeLabel.textContent = THEME_NAMES[theme];

  var scene = build();
  var bg = new Background(COLS, ROWS);
  var renderer = new Renderer(canvas, {
    cw: CW,
    ch: CH,
    fontPx: FONT_PX,
    hudPx: 15,
    author: DEFAULT_AUTHOR,
    showHint: true
  });

  var t = startT;
  var running = false;
  var paused = false;
  var firstStart = true;
  var lastNow = 0;
  var acc = 0;
  var shotIdx = 1;
  var audio = null;        // { ctx, buffer, source }
  var audioBusy = false;
  var audioDirty = false;
  var toastTimer = 0;

  // ------------------------------------------------------------------ render
  function draw() {
    var frame = stepFrame(scene, bg, t, COLS, ROWS, CW / CH, DEFAULT_MESSAGE);
    renderer.render(frame.char, frame.col, t, frame.info);
  }

  // ------------------------------------------------------------------ toast
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toastEl.classList.remove("show");
    }, 2200);
  }

  function setLoading(on) {
    loadingEl.classList.toggle("hidden", !on);
    document.getElementById("metaSep").classList.toggle("hidden", !on);
  }

  function nextFrame() {
    return new Promise(function (resolve) { setTimeout(resolve, 40); });
  }

  // ------------------------------------------------------------------ audio
  function ensureCtx() {
    if (!audio) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) throw new Error("Web Audio API is not available");
      audio = { ctx: new AC(), buffer: null, source: null };
      // ctx is created inside the user gesture; nudge it awake right away.
      if (audio.ctx.state === "suspended") audio.ctx.resume();
    }
    return audio;
  }

  function synthesizeBuffer(a) {
    var data = synthesizeSoundtrack(DURATION, T_STAR, theme);
    var buf = a.ctx.createBuffer(2, data.left.length, data.sampleRate);
    buf.getChannelData(0).set(data.left);
    buf.getChannelData(1).set(data.right);
    a.buffer = buf;
  }

  function stopSource() {
    if (audio && audio.source) {
      try { audio.source.stop(); } catch (e) { /* already stopped */ }
      audio.source = null;
    }
  }

  function playAudioAt(pos) {
    if (!audio || !audio.buffer) return;
    var a = audio;
    stopSource();
    var src = a.ctx.createBufferSource();
    src.buffer = a.buffer;
    src.loop = true;
    src.connect(a.ctx.destination);
    var off = pos % DURATION;
    if (off < 0) off += DURATION;
    src.start(0, off);
    a.source = src;
  }

  function resyncAudio() {
    if (!audio || !audio.source) return;
    if (paused) { audioDirty = true; return; }
    playAudioAt(t);
  }

  // ------------------------------------------------------------------ state
  function seek(newT) {
    t = Math.max(0, Math.min(DURATION, newT));
    if (audio && running) {
      if (paused) audioDirty = true;
      else playAudioAt(t);
    }
    draw();
  }

  function togglePause() {
    if (!running) return;
    paused = !paused;
    if (!audio) return;
    if (paused) {
      audio.ctx.suspend();
    } else {
      audio.ctx.resume();
      if (audioDirty) {
        audioDirty = false;
        playAudioAt(t);
      }
    }
  }

  async function start(withSound) {
    if (running || audioBusy) return;

    if (withSound) {
      try {
        ensureCtx();
      } catch (e) {
        console.error(e);
        toast("Trình duyệt không hỗ trợ Web Audio — chạy không âm thanh.");
        withSound = false;
      }
    }

    if (withSound) {
      audioBusy = true;
      setLoading(true);
      btnSound.disabled = true;
      btnSound.textContent = "Đang tổng hợp nhạc…";
      try {
        await nextFrame();           // let the loading state paint
        synthesizeBuffer(audio);
        await audio.ctx.resume();
      } catch (e) {
        console.error(e);
        toast("Không tổng hợp được nhạc — chạy không âm thanh.");
        withSound = false;
      }
      audioBusy = false;
      setLoading(false);
      btnSound.disabled = false;
      btnSound.textContent = "▶ Bắt đầu với nhạc";
    }

    t = firstStart ? startT : 0;
    firstStart = false;
    running = true;
    paused = false;
    acc = 0;
    audioDirty = false;
    overlay.classList.add("hidden");
    lastNow = performance.now();
    draw();

    if (withSound && audio && audio.buffer) {
      audio.ctx.resume();
      playAudioAt(t);
    } else {
      stopSource();
    }
  }

  function stopToMenu() {
    running = false;
    paused = false;
    stopSource();
    overlay.classList.remove("hidden");
  }

  // ------------------------------------------------------------------ actions
  function screenshot() {
    canvas.toBlob(function (blob) {
      if (!blob) return;
      var name = "screenshot_" + String(shotIdx).padStart(2, "0") + ".png";
      shotIdx += 1;
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 3000);
      toast("Đã lưu " + name);
    }, "image/png");
  }

  async function cycleTheme() {
    if (audioBusy) return;
    theme = theme === "last_christmas" ? "traditional" : "last_christmas";
    themeLabel.textContent = THEME_NAMES[theme];

    if (!audio) {
      toast("Nhạc: " + THEME_NAMES[theme]);
      return;
    }

    audioBusy = true;
    toast("Đang tổng hợp: " + THEME_NAMES[theme] + "…");
    try {
      await nextFrame();
      synthesizeBuffer(audio);
      if (running && !paused) playAudioAt(t);
      else audioDirty = true;
      toast("Nhạc: " + THEME_NAMES[theme]);
    } catch (e) {
      console.error(e);
      toast("Không tổng hợp được nhạc.");
    }
    audioBusy = false;
  }

  // ------------------------------------------------------------------ loop
  function loop(now) {
    requestAnimationFrame(loop);
    if (!running) {
      lastNow = now;
      return;
    }
    var dt = (now - lastNow) / 1000;
    lastNow = now;
    if (paused) {
      acc = 0;
      return;
    }
    if (!(dt > 0)) return;
    if (dt > 0.1) dt = 0.1;
    acc += dt;
    if (acc < 1 / 60) return;
    t += acc;
    acc = 0;
    if (t > DURATION) {
      t = t % DURATION;
      resyncAudio();
    }
    draw();
  }

  // ------------------------------------------------------------------ input
  document.addEventListener("keydown", function (e) {
    if (e.code === "Space") {
      e.preventDefault();
      if (!running) start(true);
      else togglePause();
      return;
    }
    if (!running) {
      if (e.key === "Enter") {
        e.preventDefault();
        start(true);
      }
      return;
    }
    switch (e.key) {
      case "r":
      case "R":
        seek(0);
        break;
      case "ArrowLeft":
        seek(t - 1);
        break;
      case "ArrowRight":
        seek(t + 1);
        break;
      case "s":
      case "S":
        screenshot();
        break;
      case "t":
      case "T":
        cycleTheme();
        break;
      case "Escape":
        stopToMenu();
        break;
    }
  });

  btnSound.addEventListener("click", function () { start(true); });
  btnMute.addEventListener("click", function () { start(false); });

  document.addEventListener("visibilitychange", function () {
    if (!audio || !running || paused) return;
    if (document.hidden) audio.ctx.suspend();
    else audio.ctx.resume();
  });

  // ------------------------------------------------------------------ boot
  var auto = params.has("start") || params.has("autostart");
  var freeze = params.has("freeze");

  if (auto) {
    firstStart = false;
    running = true;
    paused = !!freeze;
    overlay.classList.add("hidden");
    draw();
    lastNow = performance.now();
  } else {
    // Landing preview: a fully decorated frame behind the blurred overlay.
    var savedT = t;
    t = 12.0;
    draw();
    t = savedT;
  }

  requestAnimationFrame(loop);

  // Tiny debug handle (harmless in production).
  window.christmasTree = {
    seek: seek,
    pause: togglePause,
    theme: function () { return theme; },
    get time() { return t; },
    get running() { return running; }
  };
})();
</script>
